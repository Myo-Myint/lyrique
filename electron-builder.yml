appId: dev.mynt.lyrica
productName: Lyrique
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: extension
    to: extension
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  # Windows and Linux tray icon (in colour, the full-square version).
  - from: build/icon-win.png
    to: icon.png
# Name every download by architecture, so Intel and Apple Silicon builds are easy to tell apart.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signature: enough to run locally without a paid Apple Developer ID.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon.png
  extendInfo:
    LSUIElement: false
    NSHighResolutionCapable: true
    # Shown when macOS asks to let Lyrique read Spotify / Music.
    NSAppleEventsUsageDescription: Lyrique reads which song is playing in Spotify and Music to show its lyrics, and plays, pauses or skips when you use Lyrique's buttons.
dmg:
  title: Lyrique
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon-win.png
nsis:
  # One privacy screen (SignPath requires the privacy notice during installation), then a
  # per-user install: no administrator prompt, Start menu and desktop shortcuts.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  license: build/installer-privacy.txt
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  shortcutName: Lyrique
