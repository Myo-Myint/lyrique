      <stop offset="1" stop-color="#3b5bdb" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect x="192" y="364" width="640" height="128" rx="64" fill="#fff" fill-opacity="0.32" />
  <rect x="192" y="364" width="430" height="128" rx="64" fill="#fff" />
  <rect x="192" y="556" width="460" height="104" rx="52" fill="#fff" fill-opacity="0.32" />
